<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专利指南 · 从想法到权利</title>
<meta name="description" content="面向个人发明人和学生的一站式专利科普与申请指引：讲清专利是什么、三种类型、申请全流程、常见问题解决，以及合规的官方渠道——依据《专利法》及国家知识产权局公开规定整理。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1b2d'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='%23c89b3c' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ 设计系统：专利确权档案 · 暗色霓虹先锋 × 纸张档案 ============ */
:root{
  --bg:#f2efe9;            /* 暖纸底 */
  --bg2:#faf8f3;           /* 浅纸区块 */
  --card:#fcfbf7;
  --ink:#171a20;           /* 墨 */
  --ink2:#3a4049;
  --muted:#6b7078;
  --faint:#b8b3a8;         /* 淡 */
  --acid:#c8f54a;          /* 酸绿强调 */
  --acid-deep:#8fc01f;
  --cyan:#2ad4f0;          /* 电光青辅助 */
  --seal:#d9442c;          /* 印章朱红 */
  --deep:#0a0e16;          /* 深空底 */
  --deep2:#0e1526;
  --deep3:#14203a;
  --line:#e4ded2;
  --line2:#d3ccc0;
  --shadow:0 1px 0 rgba(23,26,32,.03),0 18px 44px -30px rgba(10,14,22,.35);
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.78;font-size:15.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:#14599e;text-decoration:none;border-bottom:1px solid rgba(20,89,158,.25);transition:color .18s,border-color .18s}
a:hover{color:#0d3f70;border-color:#0d3f70;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--acid);color:#171a20}
.container{width:100%;max-width:1140px;margin:0 auto;padding:0 26px}

/* 顶部：极简档案索引条（融入设计，非普通导航） */
.topbar{position:sticky;top:0;z-index:50;background:rgba(242,239,233,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .container{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--ink);font-size:15.5px;letter-spacing:.02em}
.brand .mark{width:28px;height:28px;flex:none}
.brand .en{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em;font-weight:400;text-transform:uppercase}
.topnav{display:flex;gap:0;margin-left:auto}
.topnav a{font-size:13px;color:var(--ink2);padding:8px 13px;border-radius:7px;font-weight:600;letter-spacing:.02em}
.topnav a:hover{background:#e8e2d4;color:var(--ink)}
.topnav a.active{background:var(--ink);color:var(--acid)}
.nav-toggle{display:none;margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:8px;width:42px;height:42px;color:var(--ink)}
.nav-toggle svg{width:21px;height:21px}
@media(max-width:900px){
  .topnav{position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;gap:2px;display:none}
  .topnav.open{display:flex}
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center}
  .brand .en{display:none}
}

/* ============ HERO：先锋档案封面 ============ */
.hero{position:relative;color:#eef3fb;background:
  radial-gradient(900px 540px at 88% -18%,rgba(200,245,74,.16),transparent 60%),
  radial-gradient(700px 460px at -6% 16%,rgba(42,212,240,.14),transparent 55%),
  linear-gradient(152deg,#070b13,#0d1424 52%,#0a0f1b);
  overflow:hidden;padding:86px 0 96px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px}
.hero::after{content:"PATENT ARCHIVE / 专利确权档案";position:absolute;right:-20px;top:30px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.14);transform:rotate(90deg);transform-origin:top right;white-space:nowrap}
.hero .container{position:relative;z-index:2}
.hero-top{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--acid);text-transform:uppercase;margin-bottom:34px}
.hero-top .no{color:#8b95a5}
.hero-top .seal-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,245,74,.4),transparent);max-width:180px}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.hero-copy{position:relative}
.hero-copy .ghost{position:absolute;left:-14px;top:-72px;font-family:var(--serif);font-weight:700;font-size:clamp(120px,16vw,230px);line-height:1;color:rgba(255,255,255,.045);pointer-events:none;user-select:none;z-index:0}
.hero h1{position:relative;font-weight:800;font-size:clamp(34px,5.4vw,62px);line-height:1.08;letter-spacing:-.01em;z-index:1}
.hero h1 .hl{color:var(--acid)}
.hero h1 .hl2{color:var(--cyan)}
.hero-sub{position:relative;font-size:clamp(15px,1.5vw,17.5px);color:#c3cedd;max-width:52ch;margin:22px 0 30px;z-index:1}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:9px;border:none;font-weight:700;font-size:14.5px;border-radius:8px;padding:13px 22px;transition:transform .14s,box-shadow .14s,background .2s;letter-spacing:.02em}
.btn svg{width:16px;height:16px}
.btn-acid{background:var(--acid);color:#141a03;box-shadow:0 14px 30px -14px rgba(200,245,74,.55)}
.btn-acid:hover{background:#d3fb63;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:42px;border-top:1px solid rgba(255,255,255,.12);padding-top:24px}
.hero-stats .stat{padding:0 26px;border-left:1px solid rgba(255,255,255,.12)}
.hero-stats .stat:first-child{padding-left:0;border-left:none}
.hero-stats .num{font-weight:800;font-size:32px;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.hero-stats .num small{font-size:15px;color:var(--acid)}
.hero-stats .lab{font-size:11.5px;color:#92a0b4;margin-top:7px;letter-spacing:.04em}
/* hero 装置：档案卡 + 印章 */
.hero-device{position:relative}
.dev-card{position:relative;background:linear-gradient(180deg,#fdfcf8,#f2efe6);border:1px solid #d9d2c2;border-radius:14px;padding:26px 26px 22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);z-index:1}
.dev-card .dev-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid #d9442c;padding-bottom:14px}
.dev-card .dev-no{font-size:13px;font-weight:800;color:var(--seal);letter-spacing:.04em}
.dev-card .dev-title{font-family:var(--serif);font-weight:700;font-size:22px;color:#1a1c22;margin-top:16px;line-height:1.2}
.dev-card .dev-sub{font-size:12px;color:var(--muted);margin-top:6px}
.dev-card .dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.dev-card .dev-cell{background:#f3efe6;border:1px solid #e6dfd0;border-radius:8px;padding:9px 12px}
.dev-card .dev-cell .k{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dev-card .dev-cell .v{font-size:13px;font-weight:700;color:#262a32;margin-top:2px}
.dev-card .dev-stamp{position:absolute;right:20px;bottom:-14px;width:64px;height:64px;border:2.5px solid var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--seal);font-size:10px;line-height:1.3;transform:rotate(-8deg);opacity:.92;background:rgba(252,251,247,.7);backdrop-filter:blur(2px);z-index:2;font-weight:700;text-align:center}
.dev-rail{position:absolute;left:-40px;right:-40px;bottom:-40px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,245,74,.5),transparent);z-index:0}
.dev-orb{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;filter:blur(46px);background:radial-gradient(circle,rgba(200,245,74,.28),transparent 70%);z-index:0}
.dev-steps{display:flex;justify-content:space-between;gap:8px;margin-top:26px;z-index:1;position:relative}
.dev-steps span{font-size:11.5px;color:#8f9cb0;font-family:var(--mono);letter-spacing:.08em}
.dev-steps span b{color:var(--acid);font-weight:700}

/* ============ 区块与档案式排版 ============ */
section{position:relative;padding:84px 0}
section>.container{position:relative}
.sec-wrap{position:relative;padding-top:10px}
.sec-tag{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--seal);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sec-tag::before{content:"";width:26px;height:2px;background:var(--seal)}
.sec-tag .idx{color:var(--muted)}
.sec-head{max-width:820px;margin-bottom:46px}
.sec-head h2{font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.18;color:var(--ink);letter-spacing:-.01em;position:relative}
.sec-head h2 .seal-mark{display:inline-block;color:var(--seal);font-family:var(--serif);font-weight:700;margin-left:8px;font-size:.7em}
.sec-head .lead{color:var(--muted);font-size:16px;margin-top:14px;max-width:64ch}
.alt{background:var(--bg2)}
.alt .sec-tag::before{background:var(--seal)}
/* 章节悬浮大编号 */
.ghost-sec{position:absolute;top:-20px;right:0;font-family:var(--serif);font-weight:700;font-size:clamp(90px,13vw,170px);line-height:1;color:rgba(23,26,32,.045);pointer-events:none;user-select:none;z-index:0}
.alt .ghost-sec{color:rgba(23,26,32,.04)}

/* ============ 专利是什么 ============ */
.def-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.def-cell{padding:34px 36px}
.def-cell+.def-cell{border-left:1px solid var(--line)}
.def-cell .cell-tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--seal);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.def-cell .cell-tag::before{content:"";width:18px;height:2px;background:var(--seal)}
.def-cell .big{font-family:var(--serif);font-size:clamp(19px,2.2vw,24px);line-height:1.62;color:var(--ink)}
.def-cell .big em{font-style:normal;color:#14599e;font-weight:700}
.def-cell .big strong{color:var(--seal)}
.def-cell .src{font-size:12px;color:var(--faint);margin-top:18px;border-top:1px dashed var(--line2);padding-top:14px;font-family:var(--mono);letter-spacing:.02em}
.def-stack{display:grid;gap:0;border-top:1px solid var(--line)}
.def-line{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;padding:18px 36px;border-bottom:1px solid var(--line);background:var(--card)}
.def-line .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--seal);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.def-line .k::before{content:"";width:12px;height:12px;border:1.5px solid var(--seal);transform:rotate(45deg);flex:none}
.def-line .v{font-size:14px;color:var(--ink2);line-height:1.7}

/* ============ 三种类型 ============ */
.type-list{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);box-shadow:var(--shadow)}
.type-row{display:grid;grid-template-columns:110px 1.35fr .85fr;gap:26px;align-items:start;padding:30px 32px;background:var(--card);border-top:1px solid var(--line)}
.type-row:first-child{border-top:none}
.type-row .no{font-family:var(--serif);font-weight:700;font-size:44px;color:var(--faint);line-height:1}
.type-row .main h3{font-size:23px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:12px;margin-bottom:9px}
.type-row .main .tag{font-size:11px;font-weight:800;color:var(--ink);background:var(--acid);border-radius:5px;padding:3px 9px;letter-spacing:.03em;font-family:var(--mono)}
.type-row .main .desc{font-size:14.5px;color:var(--ink2);line-height:1.72;max-width:46ch}
.type-row .meta{display:grid;gap:8px;align-content:start}
.type-row .meta .m{font-size:13px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line2);padding-bottom:7px}
.type-row .meta .m .k{color:var(--muted)}
.type-row .meta .m .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.type-row .meta .apply{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:6px}

/* ============ 为什么 / 服务 / 授权后（统一轻卡） ============ */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);box-shadow:var(--shadow)}
.why-item{background:var(--card);padding:26px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;transition:background .18s}
.why-item:hover{background:#f7f4ec}
.why-item:nth-child(4n){border-right:none}
.why-item:nth-child(n+5){border-bottom:none}
.why-item .ico{width:42px;height:42px;border-radius:7px;background:#eff2e0;display:flex;align-items:center;justify-content:center;margin-bottom:16px;border:1px solid #e0e6c8}
.why-item .ico svg{width:21px;height:21px;stroke:var(--acid-deep)}
.why-item h4{font-size:16px;color:var(--ink);margin-bottom:7px;font-weight:800}
.why-item p{font-size:13px;color:var(--muted);line-height:1.66}
.why-note{margin-top:28px;font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acid-deep);border-radius:0 10px 10px 0;padding:18px 22px;line-height:1.8}

/* ============ 流程时间轴 ============ */
.flow-line{display:grid;grid-template-columns:120px 60px 1fr;gap:0}
.flow-line .t{padding:34px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.5;letter-spacing:.04em}
.flow-line .t b{display:block;font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.flow-line .ax{position:relative;display:flex;justify-content:center}
.flow-line .ax .dot{width:18px;height:18px;border-radius:50%;background:var(--acid);z-index:2;align-self:center;box-shadow:0 0 0 4px var(--bg)}
.flow-line .ax .line{position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
.flow-line:first-child .ax .line{top:50%}
.flow-line:last-child .ax .line{bottom:50%}
.flow-line .c{padding:34px 0 0 10px}
.flow-line .c h4{font-size:18px;color:var(--ink);font-weight:800}
.flow-line .c .phase{font-family:var(--mono);font-size:11px;color:var(--seal);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.flow-line .c p{font-size:14px;color:var(--muted);line-height:1.72;max-width:62ch}
.flow-line .c ul{font-size:13.5px;color:var(--ink2);margin-top:10px;padding-left:18px}
.flow-line .c li{margin-bottom:4px}
.flow-line.hl .ax .dot{background:var(--seal)}
.branch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--seal);background:#f7e7e2;border-radius:5px;padding:4px 10px;margin-top:10px;font-family:var(--mono);letter-spacing:.03em}

/* ============ FAQ ============ */
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.faq-group{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.faq-group>h3{display:flex;align-items:center;gap:12px;padding:18px 22px;font-size:15.5px;color:var(--ink);border-bottom:1px solid var(--line);font-weight:800;background:linear-gradient(180deg,#fbf9f4,#f4efe6)}
.faq-group>h3 svg{width:18px;height:18px;stroke:var(--seal);flex:none}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item:last-child{border-bottom:none}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:none;border:none;padding:15px 22px;font-size:14px;font-weight:700;color:var(--ink2);transition:color .18s,background .18s}
.faq-q:hover{color:#14599e;background:#faf7f0}
.faq-q .pl{width:24px;height:24px;flex:none;border-radius:5px;border:1.6px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .2s,background .2s,color .2s;font-weight:700}
.faq-item.open .faq-q .pl{transform:rotate(45deg);background:var(--seal);color:#fff}
.faq-a{display:none;padding:0 22px 18px;font-size:13.5px;color:var(--ink2);line-height:1.78}
.faq-item.open .faq-a{display:block}
.faq-a .tip{display:flex;gap:9px;background:#eef2e0;border:1px solid #d9e2bc;border-radius:7px;padding:11px 13px;font-size:12.5px;color:#44521a;margin-top:10px}
.faq-a .tip svg{width:15px;height:15px;flex:none;stroke:var(--acid-deep);margin-top:2px}

/* ============ 工具（档案表单式） ============ */
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.tool-hd{display:flex;align-items:flex-start;gap:13px;padding:22px 24px 15px;border-bottom:1px dashed var(--line2)}
.tool-hd .ico{width:44px;height:44px;border-radius:7px;background:#eff2e0;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #e0e6c8}
.tool-hd .ico svg{width:22px;height:22px;stroke:var(--acid-deep)}
.tool-hd h3{font-size:18px;color:var(--ink);font-weight:800}
.tool-hd p{font-size:12.5px;color:var(--muted);margin-top:3px}
.tool-bd{padding:20px 24px;flex:1}
.tool-note{padding:11px 24px;background:#f6f3ec;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line)}
.tool-note svg{width:14px;height:14px;flex:none;margin-top:2px}

/* quiz */
.quiz-step{display:none}
.quiz-step.active{display:block}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;line-height:1.6}
.quiz-opts{display:grid;gap:9px}
.quiz-opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line2);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--card)}
.quiz-opt input{width:17px;height:17px;margin-top:3px;flex:none;accent-color:var(--acid-deep)}
.quiz-opt .txt{font-size:13.5px;color:var(--ink2)}
.quiz-opt.sel{border-color:var(--acid-deep);background:#eef2e0}
.quiz-nav{display:flex;justify-content:space-between;margin-top:18px}
.mini-btn{border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:9px 16px;border-radius:7px;font-weight:700;font-size:13.5px}
.mini-btn.primary{background:var(--ink);border-color:var(--ink);color:var(--acid)}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-result{display:none;background:#eef2e0;border:1px solid #cfddad;border-radius:9px;padding:17px 20px;margin-top:14px}
.quiz-result.show{display:block}
.quiz-result h4{color:#262c12;font-size:16px;margin-bottom:6px;font-weight:800}
.quiz-result p{font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.quiz-result .reco{margin-top:9px;padding-top:9px;border-top:1px dashed #b6c887;font-size:12.5px;color:var(--muted)}
.quiz-progress{height:4px;background:var(--line);margin:16px 24px 0;overflow:hidden}
.quiz-progress i{display:block;height:100%;background:var(--acid-deep);width:20%;transition:width .3s}

/* calculator */
.fee-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;letter-spacing:.02em}
.field select,.field input{width:100%;padding:10px 12px;border:1.4px solid var(--line2);border-radius:7px;font-size:14px;background:var(--card);color:var(--ink)}
.field select:focus,.field input:focus{outline:none;border-color:var(--acid-deep)}
.seg{display:flex;border:1.4px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{flex:1;padding:9px 0;border:none;background:transparent;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--acid)}
.fee-out{margin-top:18px}
.fee-sum{display:flex;justify-content:space-between;align-items:baseline;background:#eef2e0;border:1px solid #cfddad;border-radius:9px;padding:15px 18px;margin-bottom:12px}
.fee-sum .lab{font-size:12.5px;color:#44521a;font-weight:700}
.fee-sum .val{font-size:30px;color:#262c12;font-weight:800;font-variant-numeric:tabular-nums}
.fee-sum .val small{font-size:14px;font-weight:700}
.fee-lines{display:grid;gap:6px}
.fee-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:7px}
.fee-row .k{color:var(--ink2)}
.fee-row .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.fee-row .v.disc{color:#2e9e58}
.fee-hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.65}
.fee-hint b{color:var(--ink2)}

/* checklist */
.chk-items{display:grid;gap:8px}
.chk-item{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--card);cursor:pointer}
.chk-item input{width:17px;height:17px;flex:none;margin-top:3px;accent-color:#2e9e58}
.chk-item .tt{font-size:13.5px;font-weight:700;color:var(--ink)}
.chk-item .de{font-size:12px;color:var(--muted);margin-top:1px}
.chk-item.done{background:#eef6ef;border-color:#c7e3cf}
.chk-item.done .tt{color:#2e9e58;text-decoration:line-through}
.chk-progress{height:5px;background:var(--line);overflow:hidden;margin-top:13px}
.chk-progress i{display:block;height:100%;background:#2e9e58;width:0;transition:width .3s}
.chk-count{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ============ 服务全景 / 官方 ============ */
.official-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);box-shadow:var(--shadow)}
.off-card{background:var(--card);padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .18s}
.off-card:hover{background:#f7f4ec}
.off-card:nth-child(3n){border-right:none}
.off-card:nth-child(n+4){border-bottom:none}
.off-card .tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--seal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.off-card .tag::before{content:"";width:14px;height:14px;border:1.5px solid var(--seal);transform:rotate(45deg);margin-right:8px;flex:none}
.off-card h4{font-size:16.5px;color:var(--ink);margin-bottom:7px;font-weight:800}
.off-card p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.off-card a{font-size:13px;font-weight:700}
.off-card .note{font-size:12px;color:var(--faint);border-top:1px dashed var(--line2);padding-top:9px;margin-top:5px}
.legal-box{margin-top:26px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:0 12px 12px 0;padding:26px 30px}
.legal-box h3{font-size:16.5px;color:var(--ink);margin-bottom:13px;display:flex;align-items:center;gap:10px;font-weight:800}
.legal-box h3 svg{width:18px;height:18px;stroke:var(--seal)}
.legal-box ul{font-size:14px;color:var(--ink2);line-height:1.95;padding-left:20px}
.legal-box .warn-list{font-size:14px;color:var(--seal);line-height:1.95;padding-left:20px;margin-top:6px}
.legal-box .disp{margin-top:15px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:13px}

/* ============ footer ============ */
footer{background:var(--deep);color:#8f9cb0;padding:52px 0 46px;font-size:13px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px}
footer h5{color:#fff;font-size:15px;margin-bottom:12px;font-weight:800;letter-spacing:.02em}
footer h5 .en{font-family:var(--mono);color:var(--acid);font-size:10px;letter-spacing:.2em;text-transform:uppercase;display:block;margin-top:5px;font-weight:400}
footer a{color:#cfe4f7;border-color:rgba(207,228,247,.2)}
footer p{line-height:1.85}
.footer-meta{margin-top:28px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px;font-size:12px;color:#64718a;line-height:1.85}

/* ============ 响应式 ============ */
@media(max-width:940px){
  .hero-grid{grid-template-columns:1fr;gap:44px}
  .hero-device{max-width:420px;margin:0 auto}
  .type-row{grid-template-columns:70px 1fr}
  .type-row .meta{grid-column:2}
  .why-grid{grid-template-columns:1fr 1fr}
  .why-item:nth-child(2n){border-right:none}
  .why-item:nth-child(2n+1){border-right:1px solid var(--line)}
  .why-item:nth-child(n+3){border-bottom:1px solid var(--line)}
  .why-item:nth-child(n+5){border-bottom:none}
  .official-grid{grid-template-columns:1fr 1fr}
  .off-card:nth-child(2n){border-right:none}
  .off-card:nth-child(odd){border-right:1px solid var(--line)}
  .off-card:nth-child(n+3){border-bottom:1px solid var(--line)}
  .off-card:nth-child(n+5){border-bottom:none}
  .faq-grid,.tools-grid{grid-template-columns:1fr}
  .def-grid{grid-template-columns:1fr}
  .def-cell+.def-cell{border-left:none;border-top:1px solid var(--line)}
}
@media(max-width:560px){
  .ghost-sec{display:none}
  body{font-size:15px}
  section{padding:58px 0}
  .container{padding:0 18px}
  .hero{padding:58px 0 64px}
  .hero-stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .hero-stats .stat{padding:0 12px}
  .hero-stats .num{font-size:24px}
  .type-row{grid-template-columns:1fr;padding:24px}
  .type-row .no{font-size:34px}
  .type-row .meta{grid-column:1}
  .why-grid{grid-template-columns:1fr}
  .why-item,.why-item:nth-child(2n),.why-item:nth-child(odd){border-right:none}
  .why-item,.why-item:nth-child(n+2){border-bottom:1px solid var(--line)}
  .official-grid{grid-template-columns:1fr}
  .off-card,.off-card:nth-child(odd){border-right:none}
  .off-card:nth-child(n+2){border-bottom:1px solid var(--line)}
  .fee-form{grid-template-columns:1fr}
  .flow-line{grid-template-columns:64px 40px 1fr}
  .flow-line .c p{font-size:13.5px}
  .def-cell{padding:26px 24px}
  .def-line{grid-template-columns:1fr;padding:16px 24px;gap:6px}
}
/* 减少动态偏好：静态呈现 */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}

/* ===== AI 专利顾问 ===== */
.ai-fab{position:fixed;right:22px;bottom:22px;z-index:80;display:inline-flex;align-items:center;gap:9px;padding:13px 18px;background:var(--acid);color:#0a0d10;font-weight:700;font-size:14px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .18s ease}
.ai-fab:hover{transform:translateY(-2px)}
.ai-fab svg{width:19px;height:19px}
.ai-panel{position:fixed;right:22px;bottom:84px;z-index:80;width:392px;max-height:min(600px,80vh);display:none;flex-direction:column;background:#12151a;border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--acid);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.ai-panel.open{display:flex}
.ai-head{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ai-title{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px;font-family:var(--serif)}
.ai-title .dot{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 10px var(--acid)}
.ai-sub{color:#8a93a0;font-size:12px;margin-top:4px;letter-spacing:.02em}
.ai-close{position:absolute;top:12px;right:12px;background:transparent;border:none;color:#8a93a0;font-size:22px;cursor:pointer;width:32px;height:32px;line-height:1}
.ai-close:hover{color:#fff}
.ai-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:220px}
.ai-body::-webkit-scrollbar{width:8px}
.ai-body::-webkit-scrollbar-thumb{background:#2a3038;border-radius:4px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.msg .bubble{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.65}
.msg.ai .bubble{background:#1b2027;border:1px solid rgba(255,255,255,.06);color:#e6eaf0;border-top-left-radius:4px}
.msg.user .bubble{background:var(--acid);color:#0a0d10;font-weight:600;border-top-right-radius:4px}
.msg .src{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.14);color:#8a93a0;font-size:11.5px;line-height:1.5}
.msg .seal{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:#ff4d4f;font-size:11px;font-weight:700;letter-spacing:.08em;border:1px solid rgba(255,77,79,.5);border-radius:3px;padding:2px 6px;transform:rotate(-1.5deg)}
.ai-chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 4px}
.ai-chips button{background:transparent;border:1px solid rgba(255,255,255,.14);color:#c9d1da;font-size:12px;padding:6px 10px;border-radius:999px;cursor:pointer;transition:all .15s}
.ai-chips button:hover{border-color:var(--acid);color:var(--acid)}
.ai-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)}
.ai-foot input{flex:1;background:#1b2027;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e6eaf0;font-size:15px;padding:11px 13px;outline:none}
.ai-foot input:focus{border-color:var(--acid)}
.ai-send{width:44px;height:44px;flex:none;background:var(--acid);border:none;border-radius:10px;color:#0a0d10;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ai-send svg{width:19px;height:19px}
@media(max-width:560px){

  .ai-fab{right:14px;bottom:14px;padding:12px 15px}

}

<section id="what" class="view" data-v="what">
<div class="ghost-sec" aria-hidden="true">01</div>
  <div class="container">
    
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">01</span> 专利是什么</div>
      <h2>一句话：用「公开技术」换「一段时间的排他保护」</h2>
      <p class="lead">专利是专利法赋予专利权人对其发明创造，在一定期限内享有的独占实施权。核心逻辑是你把技术方案充分公开，国家依法在一定年限内授予你排他保护，他人未经许可不得实施。</p>
    </div>
    <div class="def-grid">
      <div class="def-cell"><div class="cell-tag">定义 · 专利是什么</div>
        <p class="big">专利，指依法受保护的<strong>发明创造</strong>所享有的排他性权利。依据现行《中华人民共和国专利法》（2020年修正、2021年6月1日施行），我国专利分为<em>发明、实用新型、外观设计</em>三种。</p>
        <p class="big" style="margin-top:14px">申请一项专利，通常需要具备法律要求的<strong>新颖性、创造性、实用性</strong>（发明与实用新型）；保护期限自申请日起计算。</p>
        <div class="src">依据：《专利法》第2条（定义）、第22条（三性）、第42条（期限）</div>
      </div>
      <div class="def-cell"><div class="cell-tag">一句话核心</div>
        <p class="big">用<em>公开技术</em>，换<strong>一段时间的排他保护</strong>——把技术方案充分公开，国家依法在期限内授予你独占实施权，他人未经许可不得实施。</p>
      </div>
    </div>
    <div class="def-stack">
      <div class="def-line"><div class="k">保护期 · 自申请日起</div><div class="v">发明 20 年 · 实用新型 10 年 · 外观设计 15 年</div></div>
      <div class="def-line"><div class="k">审查方式</div><div class="v">发明需经实质审查（周期较长）；实用新型、外观设计一般经初步审查。</div></div>
      <div class="def-line"><div class="k">申请在先原则</div><div class="v">同样的发明创造，专利权授予最先申请的人——早申请、早确权很关键。</div></div>
    </div></div>
  </div>
</section>

<!-- ===================== TYPES ===================== -->
<section id="types" class="alt view" data-v="types">
<div class="ghost-sec" aria-hidden="true">02</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">02</span> 三种专利类型</div>
      <h2>先搞清楚：你的成果适合申请哪一种？</h2>
      <p class="lead">三种类型保护的对象、审查方式、保护期和申请费用都不同，选对类型是省钱省时的第一步。</p>
    </div>
    <div class="type-list">
<div class="type-row">
      <div class="no">01</div>
      <div class="main"><h3>发明专利 <span class="tag">保护期 20 年</span></h3><p class="desc">对产品、方法或者其改进所提出的<strong>新的技术方案</strong>。技术含量和创造性要求最高，须经实质审查，授权后保护强度高。</p></div>
      <div class="meta"><div class="m"><span class="k">审查方式</span><span class="v">实质审查</span></div><div class="m"><span class="k">申请费</span><span class="v">900 元</span></div><div class="m"><span class="k">周期参考</span><span class="v">约 15 个月起（可优先审查）</span></div><div class="apply"><b>适合：</b>有较高创造高度的产品、方法、算法/软件与硬件结合的技术方案。</div></div>
    </div>
<div class="type-row">
      <div class="no">02</div>
      <div class="main"><h3>实用新型专利 <span class="tag">保护期 10 年</span></h3><p class="desc">对产品的<strong>形状、构造</strong>或者其结合所提出的适于实用的新的技术方案。只保护产品结构，不保护方法。</p></div>
      <div class="meta"><div class="m"><span class="k">审查方式</span><span class="v">初步审查</span></div><div class="m"><span class="k">申请费</span><span class="v">500 元</span></div><div class="m"><span class="k">周期参考</span><span class="v">一般半年至一年左右</span></div><div class="apply"><b>适合：</b>结构、装置类的改进型创新，费用低、授权快，是学生和个人的热门选择。</div></div>
    </div>
<div class="type-row">
      <div class="no">03</div>
      <div class="main"><h3>外观设计专利 <span class="tag">保护期 15 年</span></h3><p class="desc">对产品的整体或局部的<strong>形状、图案</strong>及其结合，以及色彩与形状、图案的结合所作出的富有美感并适于工业应用的新设计。</p></div>
      <div class="meta"><div class="m"><span class="k">审查方式</span><span class="v">初步审查</span></div><div class="m"><span class="k">申请费</span><span class="v">500 元</span></div><div class="m"><span class="k">周期参考</span><span class="v">一般半年至一年左右</span></div><div class="apply"><b>适合：</b>产品外观、造型、包装等以视觉效果为主的设计。</div></div>
    </div>
    </div></div>

</section>

<!-- ===================== WHY ===================== -->
<section id="why" class="view" data-v="why">
<div class="ghost-sec" aria-hidden="true">03</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">03</span> 为什么要申请</div>
      <h2>专利不只是「一张证书」</h2>
      <p class="lead">对个人发明人和学生来说，专利兼具保护、竞争与成长价值。</p>
    </div>
    <div class="why-grid">
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
        <h4>获得排他权利</h4>
        <p>授权后，未经你许可，他人不得为生产经营目的制造、使用、许诺销售、销售、进口你的专利产品。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h4>抢占先申请先机</h4>
        <p>我国实行申请在先原则，越早申请越早确立权利归属，也能防止创新成果被他人抢先占位。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20V8"/><path d="M3 20h20"/></svg></div>
        <h4>形成无形资产</h4>
        <p>专利可作为资产进行许可、转让、质押融资，也是企业申报高新、招投标、评职称的重要指标。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg></div>
        <h4>助力成长与评价</h4>
        <p>对学生可用于保研加分、综测、学科竞赛、项目结题；对企业可用于项目申报与无形资产估值。</p>
      </div>
    </div>
    <p class="why-note">提示：专利的意义在于「确权 + 排他」。真正能被授权并发挥保护作用的，是基于真实创新、依法规范撰写的申请——而不是为凑数、为加分的低质量申请。</p>
  </div>
</section>

<!-- ===================== FLOW ===================== -->
<section id="flow" class="alt view" data-v="flow">
<div class="ghost-sec" aria-hidden="true">04</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">04</span> 申请全流程</div>
      <h2>从想法到专利证书，走对这七步</h2>
      <p class="lead">以发明专利为主线的完整路径（实用新型、外观设计跳过第 5 步的实质审查）。每一步下方都列出你会遇到的常见问题，可在「常见问题」板块查看解决办法。</p>
    </div>
    <div class="flow-overview">
      <div class="fo-item"><span class="n">阶段一 · 申请前</span><h4>检索 + 撰写</h4><p>官方平台查新判断可行性；备齐请求书、说明书、权利要求书。申请前不要自行公开。</p></div>
      <div class="fo-item"><span class="n">阶段二 · 提交 + 初审</span><h4>锁定申请日</h4><p>在线提交取得申请日与申请号；缴纳费用（可费减）；发明约 18 个月公开。</p></div>
      <div class="fo-item"><span class="n">阶段三 · 实质审查</span><h4>发明需实审</h4><p>自申请日起 3 年内请求实质审查，核查三性并答复意见；实用新型/外观无此步。</p></div>
      <div class="fo-item"><span class="n">阶段四 · 授权后</span><h4>缴年费维持</h4><p>逐年缴纳年费，逾期可能失效；著录项目变更要及时办理。</p></div>
    </div>
    <div class="flow-wrap">
      <div class="flow-line">
        <div class="t">Step 1<br>检索</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">查新 · 判断可行性</div>
          <h4>专利检索与查新</h4>
          <p>先用关键词、分类号在官方检索平台检索，判断你的方案是否已有相同或相近的技术公开。这一步能帮你避开「已被公开 / 在先申请」的驳回风险，也是撰写权利要求的重要参考。</p>
          <ul>
            <li>免费渠道：国家知识产权局专利检索及分析系统（pss-system.cponline.cnipa.gov.cn）</li>
            <li>关注点：相同技术已被公开、已被他人申请在先，都可能影响新颖性</li>
          </ul>
        </div>
      </div>
      <div class="flow-line">
        <div class="t">Step 2<br>撰写</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">文件 · 决定授权成败</div>
          <h4>撰写申请文件</h4>
          <p>发明/实用新型通常包括：请求书、说明书及其摘要、权利要求书，实用新型还必须有说明书附图；外观设计则提交图片或照片及简要说明。权利要求书界定了保护范围，是最核心的法律文件。</p>
          <ul>
            <li>权利要求书：清楚、简要地限定保护范围，忌过宽（易驳回）或过窄（保护不足）</li>
            <li>说明书：必须对技术方案作出清楚、完整的说明，使所属领域技术人员能够实现</li>
          </ul>
        </div>
      </div>
      <div class="flow-line">
        <div class="t">Step 3<br>提交</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">受理 · 锁定申请日</div>
          <h4>提交申请，获得申请日与申请号</h4>
          <p>推荐通过国家知识产权局「专利业务办理系统」（cponline.cnipa.gov.cn）在线提交电子申请，也可使用 CPC 客户端或提交纸质申请。受理后即取得申请日（具有法律意义的先后次序依据）与申请号。</p>
          <ul>
            <li>个人可自行提交，也可委托经备案的专利代理机构办理</li>
            <li>同时缴纳申请费等费用（符合条件可申请费用减缴）</li>
          </ul>
        </div>
      </div>
      <div class="flow-line">
        <div class="t">Step 4<br>初审</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">初步审查</div>
          <h4>受理后的初步审查</h4>
          <p>审查申请文件是否齐全、格式是否规范、明显缺陷等。发明、实用新型、外观设计均需经过初审。实用新型和外观设计经初审符合要求后，即可进入授权或视情况驳回。</p>
          <div class="branch">实用新型 / 外观设计：初审通过 → 授权公告（无实质审查）</div>
        </div>
      </div>
      <div class="flow-line">
        <div class="t">Step 5<br>实审<br><small style="color:#7b8794">仅发明</small></div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">公布 + 实质审查 · 仅发明专利</div>
          <h4>公开与实质审查</h4>
          <p>发明专利申请自申请日（或优先权日）起满 18 个月即公开；申请人需自申请日起 <strong>3 年内</strong>提出实质审查请求并缴纳实质审查费。实审重点核查新颖性、创造性、实用性。</p>
          <ul>
            <li>未在规定期限内请求实审的，申请将被视为撤回</li>
            <li>可依规定请求优先审查，缩短等待时间</li>
          </ul>
        </div>
      </div>
      <div class="flow-line">
        <div class="t">Step 6<br>授权</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">登记 · 颁证</div>
          <h4>授权公告与登记</h4>
          <p>经审查符合授权条件的，国家知识产权局作出授权决定，申请人办理登记手续、缴纳授权当年的年费和印花税后，颁发专利证书并公告。</p>
        </div>
      </div>
      <div class="flow-line hl">
        <div class="t">Step 7<br>维持</div>
        <div class="ax"><span class="dot"></span><span class="line"></span></div>
        <div class="c">
          <div class="phase">长期 · 别让权利失效</div>
          <h4>按时缴纳年费，维持专利权</h4>
          <p>专利权需逐年缴纳年费维持。逾期可在宽限期内补缴并缴滞纳金；长期不缴费，专利权将终止。请务必记住缴费节点，这是最容易被忽视的「失效原因」。</p>
          <ul>
            <li>可在专利业务办理系统中开通缴费提醒，管理多个专利的年费</li>
            <li>注意著录项目变更（如姓名、地址变更）及时办理</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="flow-table">
      <h3 class="ft-title">申请各阶段 · 关键时间与费用总览</h3>
      <div class="ft-wrap"><table>
        <colgroup><col style="width:12%"><col style="width:28%"><col style="width:16%"><col style="width:18%"><col style="width:26%"></colgroup>
        <thead><tr><th>阶段</th><th>做什么</th><th>时间节点</th><th>费用（官费）</th><th>常见坑</th></tr></thead>
        <tbody>
          <tr><td>检索</td><td>官方「专利检索及分析系统」查新，判断方案是否已被公开/在先申请</td><td>申请前</td><td>免费</td><td>不查新就撰写，易踩在先技术导致驳回</td></tr>
          <tr><td>撰写</td><td>备齐请求书、说明书、权利要求书（实用新型需附图）；外观提交图片/照片</td><td>申请前</td><td>0（自行撰写）</td><td>权利要求过宽/过窄；申请前已公开破坏新颖性</td></tr>

<section id="faq" class="view" data-v="faq">
<div class="ghost-sec" aria-hidden="true">05</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">05</span> 常见问题</div>
      <h2>申请中会遇到的问题，这里都有合规答案</h2>
      <p class="lead">按「资格 → 费用 → 撰写 → 流程 → 审查 → 维护与合规」分组整理，答案基于《专利法》及国家知识产权局公开规定，点击展开查看。</p>
    </div>
    <div class="faq-grid">

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/></svg>申请资格与主体</h3>
        <div class="faq-item">
          <button class="faq-q">学生或普通个人可以申请专利吗？<span class="pl">+</span></button>
          <div class="faq-a">可以。自然人和单位均可作为申请人。需要留意<strong>职务发明</strong>：执行本单位任务或主要利用本单位物质技术条件完成的发明创造，专利权一般归单位。学生参与学校课题产生的成果，建议先与学校/课题组确认成果归属约定，再决定由谁申请。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">发明人和申请人是一回事吗？<span class="pl">+</span></button>
          <div class="faq-a"><strong>发明人</strong>是对发明创造的实质性特点作出创造性贡献的人，只能是自然人；<strong>申请人</strong>可以是发明人、单位，也可以是受让人。例如「学生发明、学校申请」的职务发明就属于二者分离的常见情形。</div>
        </div>
      </div>

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg>费用与减缴</h3>
        <div class="faq-item">
          <button class="faq-q">申请专利一共要花多少钱？能减免吗？<span class="pl">+</span></button>
          <div class="faq-a">授权前首次官费大致为：<strong>发明</strong>3450 元（申请费 900 + 公布印刷费 50 + 实质审查费 2500）；<strong>实用新型/外观设计</strong>500 元。符合条件的个人（上年度月均收入低于 5000 元）或企业（上年度应纳税所得额低于 100 万元）可减缴 <strong>85%</strong>；两人及以上共同申请的减缴 <strong>70%</strong>。<div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M12 16v-4M12 8h.01"/></svg>减缴后发明首次约 560 元、实用新型约 75 元。可用下方「费用估算器」试算。</div></div>
        </div>
        <div class="faq-item">
          <button class="faq-q">什么时候要交钱？不交会怎样？<span class="pl">+</span></button>
          <div class="faq-a">申请费在提交/受理后缴纳；发明专利的实质审查费在提出实审请求时缴纳；授权时缴纳授权当年年费和印花税。逾期不缴，申请可能被视为撤回或不予受理。推荐通过国家知识产权局「专利业务办理系统」在线缴费。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">授权后每年都要交年费吗？<span class="pl">+</span></button>
          <div class="faq-a">需要逐年缴纳。发明年费：1–3 年每年 900 元、4–6 年 1200、7–9 年 2000、10–12 年 4000、13–15 年 6000、16–20 年 8000；实用新型/外观设计：1–3 年 600、4–5 年 900、6–8 年 1200、9–10 年 2000。逾期可在 6 个月宽限期内补缴并加缴滞纳金。</div>
        </div>
      </div>

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>撰写与材料</h3>
        <div class="faq-item">
          <button class="faq-q">申请文件要准备哪些？<span class="pl">+</span></button>
          <div class="faq-a">发明/实用新型：<strong>请求书、说明书及其摘要、权利要求书</strong>，实用新型还必须提交<strong>说明书附图</strong>；外观设计：图片或照片及简要说明。权利要求书界定保护范围，说明书需清楚完整地说明技术方案，使本领域技术人员能够实现。可用下方「材料清单」逐项核对。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">文件可以自己写吗？还是必须找代理？<span class="pl">+</span></button>
          <div class="faq-a">可以自行撰写并提交，也可委托经国家知识产权局备案的专利代理机构（由执业专利代理师办理）。专业撰写通常能提高授权率、争取更合理的保护范围，但属于有偿服务。是否委托，取决于你对申请质量的预期与预算。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">权利要求书写宽了还是窄了好？<span class="pl">+</span></button>
          <div class="faq-a">不宜过宽也不宜过窄：过宽易因落入已有技术、缺少创造性而驳回；过窄则保护范围小、防不住模仿。应在检索基础上，用「一项独立权利要求 + 若干从属权利要求」的布局兼顾稳定性与保护范围。具体撰写建议咨询专业代理师。</div>
        </div>
      </div>

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>流程与进度</h3>
        <div class="faq-item">
          <button class="faq-q">申请到授权要多久？<span class="pl">+</span></button>
          <div class="faq-a">据国家知识产权局公开信息，当前<strong>发明专利平均审查周期已压减至约 15 个月</strong>，还可依法请求优先审查；实用新型、外观设计一般经初步审查，通常约半年至一年左右。实际周期受申请量、材料质量、答复速度等因素影响。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">申请日为什么很重要？<span class="pl">+</span></button>
          <div class="faq-a">申请日决定<strong>申请在先次序</strong>、<strong>保护期起算点</strong>，以及多个法定期限的起点（如发明须在 3 年内请求实审、优先权期限等）。电子申请提交成功的当日即为申请日，务必留存受理通知与申请号。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">提交后还能补正或修改吗？<span class="pl">+</span></button>
          <div class="faq-a">可以，但须依法进行。初审阶段可对明显缺陷补正；发明实审中对权利要求的修改<strong>不得超出原说明书和权利要求书记载的范围</strong>。按要求补正/答复，是流程中的正常环节。</div>
        </div>
      </div>

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M5 3h14v6l-7 6v4H5V3z"/></svg>审查与答复</h3>
        <div class="faq-item">
          <button class="faq-q">收到审查意见通知书怎么办？<span class="pl">+</span></button>
          <div class="faq-a">在通知书载明的期限内答复。发明实审中的审查意见通知书常涉及新颖性、创造性，需在期限内陈述意见或依法修改文件；逾期未答复，申请可能被视为撤回。答复质量直接关系能否授权，必要时可咨询代理师。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">被驳回了还有补救机会吗？<span class="pl">+</span></button>
          <div class="faq-a">有。对驳回决定不服，可在收到之日起 <strong>3 个月内</strong>向国家知识产权局请求<strong>复审</strong>；对复审决定仍不服的，可依法向人民法院提起行政诉讼。也可在答复阶段通过合理修改争取授权。</div>
        </div>
      </div>

      <div class="faq-group">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>维护与合规</h3>
        <div class="faq-item">
          <button class="faq-q">忘缴年费，专利会失效吗？<span class="pl">+</span></button>
          <div class="faq-a">会。超过缴费期限未缴，有 6 个月宽限期，期间补缴需同时缴滞纳金；宽限期届满仍未缴，专利权终止。建议在专利业务办理系统及时缴纳并留意提醒，管理多件专利时尤其注意。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">什么是「非正常申请」？为什么不能碰？<span class="pl">+</span></button>
          <div class="faq-a">非正常申请指不以保护创新为目的的异常申请行为，如批量拼凑、低质量重复申请、恶意囤积占位等。此类申请会被国家知识产权局依法处理（要求主动撤回、纳入监控，情节严重依法处置）。请始终<strong>基于真实创新</strong>规范申请。</div>
        </div>
        <div class="faq-item">
          <button class="faq-q">网上「包过」「快速下证」靠谱吗？<span class="pl">+</span></button>
          <div class="faq-a">专利授权有法定审查标准，不存在「包授权」。请选择经国家知识产权局<strong>备案的专利代理机构</strong>，警惕夸大宣传与高价「保授权」服务；一切以官方规定和受理进程为准。</div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ===================== KNOWLEDGE ===================== -->
<section id="knowledge" class="view" data-v="knowledge">
<div class="ghost-sec" aria-hidden="true">07</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">07</span> 知识深化与申请策略</div>
      <h2>申请之前，先把这几个关键问题想清楚</h2>
      <p class="lead">可专利性、公开时机、优先权、国际申请……这些决定你的申请能不能成功、值不值得做。</p>
    </div>
<div class="def-grid">
      <div class="def-cell"><div class="cell-tag">可专利性 · 判断依据</div>
        <h3 style="font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:10px">什么「能申请」，什么「不能申请」</h3>
        <p class="big" style="font-size:18px">能申请专利的技术方案需具备<em>新颖性、创造性、实用性</em>。依据《专利法》第 25 条，下列对象<strong>不授予专利权</strong>：科学发现；智力活动的规则和方法（如纯商业方法、数学方法、游戏规则）；疾病的诊断和治疗方法；动物和植物品种；用原子核变换方法获得的物质；对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计。</p>
        <p class="big" style="font-size:16px;margin-top:10px">注意：动物和植物品种本身不可申请，但其<strong>生产方法</strong>可以；计算机程序若与硬件结合构成技术方案，可申请发明专利。</p>
        <div class="src">依据：《专利法》第 2 条、第 22 条、第 25 条</div>
      </div>
    </div>
    <div class="def-stack">
      <div class="def-line"><div class="k">新颖性宽限期</div><div class="v">在政府主办/承认的展会、学术会议首次发表、他人未经同意泄露等法定情形后 6 个月内申请，不丧失新颖性（《专利法》第 24 条）。</div></div>
      <div class="def-line"><div class="k">优先权</div><div class="v">发明/实用新型自首次申请日起 <strong>12 个月</strong>内、外观设计 <strong>6 个月</strong>内可要求本国优先权，再完善后重新申请，在先申请视为撤回。</div></div>
      <div class="def-line"><div class="k">先申请再公开</div><div class="v">不要在申请前自行公开销售、发表——这会破坏新颖性。先申请占位，再对外展示。</div></div>
    </div>    </div>

    <div class="why-grid" style="margin-top:26px">
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.7-5.2 2.7 1-5.9L3.5 8.2l5.9-.9z"/></svg></div>
        <h4>实用新型先占位</h4>
        <p>结构改进型成果可先用实用新型快速授权占位，再视市场价值决定是否布局发明专利，控制节奏与成本。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h4>留好证据链</h4>
        <p>保留研发记录、设计稿、代码、会议纪要等，既是撰写依据，也在需要时支撑权属与在先使用的证明。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></div>
        <h4>是否要走国际</h4>
        <p>多数个人用户先布局国内即可。若需多国保护，可走 PCT 途径（自优先权日起 30 个月内进入各国）或巴黎公约优先权。</p>
      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16h12M8 12h8M10 8h4M12 4h0"/></svg></div>
        <h4>归属要约定</h4>
        <p>职务发明成果归属单位；校企/多人合作成果，先书面约定专利权归属与收益分配，避免授权后纠纷。</p>
      </div>
    </div>
  </div>
</section>

<section id="service" class="alt view" data-v="service">
<div class="ghost-sec" aria-hidden="true">08</div>
  <div class="container">
    <div class="sec-head">
      <div class="sec-tag"><span class="idx">08</span> 专利服务全景</div>
      <h2>市面上跟专利有关的一切，一张图看全</h2>
      <p class="lead">确权、检索、法务、运营、教育、官方服务——不同阶段你需要不同支持。下面按场景归类，附官方合规入口，让你知道「这件事该找谁、该用什么工具」。</p>
    </div>
    <div class="official-grid">
      <div class="off-card">
        <span class="tag">确权申请</span>
        <h4>自己办 or 找代理</h4>
        <p>个人可自行通过官方系统提交；也可委托经备案的专利代理机构。市场参考：发明代理费约 4000–5000 元、实用新型约 1500–2000 元、外观约 1000–1200 元（仅供参考，以实际报价为准）。</p>

      <div class="off-card">
        <span class="tag">检索分析</span>
        <h4>查新 · 导航 · 监控</h4>
        <p>用官方「专利检索及分析系统」免费查新（收录 100 余国数据）；外观设计可用图像识别检索系统比对；重点产业有专利专题数据库。</p>
        <div class="note">申请前查新、授权后监控竞品，都能在官方公共服务平台上完成。</div>
      </div>
      <div class="off-card">
        <span class="tag">法律服务</span>
        <h4>维权 · 无效 · 诉讼</h4>
        <p>被侵权可协商、请求行政机关处理或向法院起诉；他人挑战你的专利可走无效宣告程序；涉诉请委托执业专利代理师或律师。</p>
        <div class="note">维权援助可拨打市场监管热线 12315 / 知识产权维权援助渠道。</div>
      </div>
      <div class="off-card">
        <span class="tag">运营转化</span>
        <h4>转让 · 许可 · 质押</h4>
        <p>专利可作为无形资产转让、许可（需办理备案）、质押融资（依《专利权质押登记办法》登记）。全国知识产权运营服务平台体系提供对接。</p>
        <div class="note">高校与科研机构存量专利正在被大规模盘活，个人成果转化也有政策支持。</div>
      </div>
      <div class="off-card">
        <span class="tag">学习教育</span>
        <h4>课程 · 资格考试</h4>
        <p>想深入了解可学习专利代理师资格考试内容、国家知识产权局公开培训资料与知识产权公共服务平台课程，系统掌握检索与撰写。</p>
        <div class="note">适合想从「会用」进阶到「专业」的申请人与从业者。</div>
      </div>
      <div class="off-card">
        <span class="tag">官方服务</span>
        <h4>受理 · 缴费 · 费减</h4>
        <p>申请、缴费、费用减缴、审查进度、著录项目变更等一切手续，统一走国家知识产权局官方系统办理。</p>
        <div class="note">务必使用官方渠道，保护个人信息与申请材料安全。</div>
      </div>
    </div>
  </div>
</section>

      <p class="lead">授权后的专利同样需要经营与保护——评价报告、无效应对、侵权维权、转让许可、质押融资，都属于「专利生命周期」的重要环节。</p>

      </div>
      <div class="why-item">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>

        <p>被侵权：可协商、请求行政处理或诉讼；被控侵权：先核实对方权利范围与证据，再做合法抗辩，不轻易认责。</p>

/* ===== 类型自测 ===== */
var quiz=document.getElementById('quiz'),steps=quiz.querySelectorAll('.quiz-step'),cur=0;
var quizProg=document.getElementById('quizProg'),quizPrev=document.getElementById('quizPrev'),quizNext=document.getElementById('quizNext');
var quizResult=document.getElementById('quizResult');
function radioVal(name){var r=quiz.querySelector('input[name="'+name+'"]:checked');return r?r.value:null;}
function setSelVisual(stepEl){stepEl.querySelectorAll('.quiz-opt').forEach(function(o){o.classList.toggle('sel',o.querySelector('input').checked);});}
function updQuiz(){
  steps.forEach(function(s,i){s.classList.toggle('active',i===cur);});
  quizProg.style.width=Math.round((cur+1)/3*100)+'%';
  quizPrev.disabled=(cur===0);
  setSelVisual(steps[cur]);
  if(cur===0)quizNext.textContent='下一步';
  else if(cur===1)quizNext.textContent='下一步';
  else quizNext.textContent='查看结果';
}
function finishQuiz(type){
  var t={design:['外观设计专利','保护产品的形状、图案等美感设计，保护期 15 年，一般经初步审查，费用较低。','适合以视觉效果为主的造型与包装设计。'],
          inv:['发明专利','保护方法、工艺、算法或创造性较高的技术方案，保护期 20 年，需经实质审查（周期较长）。','适合技术含量高、希望保护方法本身或更高保护强度的创新。'],
          um:['实用新型专利','保护产品结构改进，保护期 10 年，仅初步审查，费用低、授权快。','适合结构装置类的改进型创新，是预算有限的常见选择。']};
  document.getElementById('quizResTitle').textContent='建议申请：'+t[type][0];
  document.getElementById('quizResBody').textContent=t[type][1];
  document.getElementById('quizResReco').textContent='提示：'+t[type][2]+' 以上为初步判断，请结合检索结果与专业意见确定最终类型。';
  quizResult.classList.add('show');
  quizPrev.style.display='none';quizNext.textContent='重新测试';quizNext.dataset.restart='1';
}
quizNext.addEventListener('click',function(){
  if(this.dataset.restart){cur=0;quizResult.classList.remove('show');quizPrev.style.display='';delete this.dataset.restart;updQuiz();return;}
  var v=radioVal('q'+cur);
  if(!v){return;}
  if(cur===0&&v==='design'){finishQuiz('design');}
  else if(cur===1&&v==='method'){finishQuiz('inv');}
  else if(cur===2){finishQuiz(v==='high'?'inv':'um');}
  else{cur++;updQuiz();}
});
quizPrev.addEventListener('click',function(){if(cur>0){cur--;updQuiz();}});

/* ===== 费用估算器 ===== */
var FEE={
  inv:[{k:'申请费',a:900,r:1},{k:'公布印刷费',a:50,r:0},{k:'实质审查费',a:2500,r:1}],
  um:[{k:'申请费',a:500,r:1}],
  design:[{k:'申请费',a:500,r:1}]
};
var YEAR_FEE={inv:900,um:600,design:600};
var feeType=document.getElementById('feeType'),feeRelief='85';
function feeCompute(){
  var lines=FEE[feeType.value],rate=feeRelief==='none'?1:(feeRelief==='85'?0.15:0.30),total=0;
  var html='',disc;
  lines.forEach(function(l){
    var amt=feeRelief==='none'||!l.r?l.a:Math.round(l.a*rate);
    total+=amt;disc=feeRelief!=='none'&&l.r;
    html+='<div class="fee-row"><span class="k">'+l.k+'</span><span class="v'+(disc?' disc':'')+'">¥'+amt.toLocaleString()+(disc?'（减免）':'')+'</span></div>';
  });
  var yf=feeRelief==='none'?YEAR_FEE[feeType.value]:Math.round(YEAR_FEE[feeType.value]*(feeRelief==='85'?0.15:0.30));
  html+='<div class="fee-row"><span class="k">授权当年年费（第 1 年）</span><span class="v">¥'+yf.toLocaleString()+'</span></div>';
  document.getElementById('feeTotal').textContent=total.toLocaleString();
  document.getElementById('feeLines').innerHTML=html;
  var n=feeType.value==='inv'?'发明':'实用新型/外观设计';
  var hi='授权后每年需缴年费维持；'+n+'第 1 年'+(feeRelief==='none'?'':'（减缴后）')+'为 ¥'+yf.toLocaleString()+'。';
  document.getElementById('feeHint').textContent='说明：'+hi+' 上述金额为官费参考，代理服务费另计，以官方实际收取为准。';
}
feeType.addEventListener('change',feeCompute);
document.querySelectorAll('#feeRelief button').forEach(function(b){
  b.addEventListener('click',function(){
    feeRelief=this.dataset.v;
    document.querySelectorAll('#feeRelief button').forEach(function(x){x.classList.toggle('on',x===b);});

  });
});
feeCompute();

function initChk(id,barId,cntId,hintId,items,doneMsg){
  var c=document.getElementById(id),html='';
  items.forEach(function(x){html+='<label class="chk-item"><input type="checkbox"><span><span class="tt">'+x.t+'</span><span class="de">'+(x.d||'')+'</span></span></label>';});
  c.innerHTML=html;
  function upd(){
    var n=0;c.querySelectorAll('input').forEach(function(b){if(b.checked){n++;b.closest('.chk-item').classList.add('done');}else{b.closest('.chk-item').classList.remove('done');}});
    document.getElementById(barId).style.width=Math.round(n/items.length*100)+'%';
    document.getElementById(cntId).textContent='已核对 '+n+' / '+items.length+' 项';
    document.getElementById(hintId).textContent=(doneMsg&&n===items.length)?doneMsg:'';

  upd();
}

   {kw:['权利要求','怎么写','撰写','独权','从权'],a:'权利要求书是<strong>保护范围的法律边界</strong>：<br>• 写<strong>过宽</strong>易被在先技术驳回；写<strong>过窄</strong>则保护不足；<br>• 独立权利要求概括必要技术特征，从属权利要求进一步限定；<br>• 说明书须清楚、完整，使本领域技术人员能够<strong>实现</strong>。<br>建议先检索再撰写，重要申请可委托执业代理师。',s:'依据：《专利法》第 26 条、《专利审查指南》。'},
   {kw:['公开','发表','展示','卖出','泄露','宣传'],a:'申请前自行公开（销售、发表、展示）通常<strong>会破坏新颖性</strong>，无法授权。<br>但属法定情形（政府/承认的展会首次展出、规定学术会议首次发表、他人未经同意泄露等），<strong>6 个月内</strong>申请不丧失新颖性（《专利法》第 24 条）。<br>原则：<strong>先申请占位，再对外公开</strong>。',s:'依据：《专利法》第 24 条（新颖性宽限期）。'},
   {kw:['优先权','优先','完善','重新申请'],a:'同一主题后续完善的申请，可在<strong>发明/实用新型自首次申请日起 12 个月内、外观设计 6 个月内</strong>要求本国优先权，在先申请视为撤回，以首次申请日为优先权日。',s:'依据：《专利法》第 29、30 条。'},
   {kw:['查新','检索','有没有人','被驳回','风险','可行性','能不能授权'],a:'申请前务必<strong>查新</strong>：用官方「专利检索及分析系统」（pss-system.cponline.cnipa.gov.cn）以关键词 + IPC 分类号检索，判断方案是否已被公开或他人申请在先。<br>相同技术已公开/在先申请，都可能导致<strong>新颖性不足被驳回</strong>。可用页内「可专利性速查」自检。',s:'依据：《专利法》第 22 条（新颖性）。'},
   {kw:['包过','保证','一定','稳','下证','必过'],a:'没有机构能<strong>保证授权</strong>——授权有法定审查标准，是否具备新颖性、创造性等由审查决定。<br>警惕「<strong>包授权、快速下证</strong>」承诺与超低价代理，多为夸大宣传。选代理先查其是否在官方<strong>备案</strong>。',s:'依据：官方代理机构备案与审查制度。'},
   {kw:['非正常','红线','违法','合规','合法','风险','犯法','会不会'],a:'请<strong>依法依规申请</strong>。以下行为会被依法处置：伪造申请材料、虚构发明、<strong>非正常申请</strong>（不以保护创新为目的的批量/低质量/囤积申请）、恶意抢注占位、规避审查。<br>真正的专利价值来自基于真实创新的规范申请，不为凑数、加分而申请。',s:'依据：《专利法》及非正常申请管理规定。'},
   {kw:['官方','官网','网址','在哪办','哪里办'],a:'三个官方入口：<br>• 官网门户（法规/政策/收费/维权）：www.cnipa.gov.cn<br>• 专利业务办理系统（提交/缴费/费减/查询）：cponline.cnipa.gov.cn<br>• 专利检索及分析系统（查新）：pss-system.cponline.cnipa.gov.cn<br>一律通过官方渠道办理。',s:'依据：国家知识产权局官方平台。'},
   {kw:['国外','国际','pct','美国','海外','多国'],a:'需多国保护可选：<br>• <strong>PCT 途径</strong>：先提国际申请，自优先权日起 <strong>30 个月</strong>内进入各指定国；<br>• <strong>巴黎公约优先权</strong>：首次申请后 12 个月内直接向目标国申请并要求优先权。<br>国际申请更复杂、费用更高，建议咨询专业人士。多数个人用户先布局国内即可。',s:'依据：《专利合作条约》（PCT）、《巴黎公约》。'},
   {kw:['授权后','维权','侵权','转让','许可','质押','评价报告','运营'],a:'授权后仍需经营：<br>• 每年<strong>缴纳年费</strong>维持；<br>• 维权：协商、请求行政处理或诉讼；<br>• 运营：转让、许可（独占/排他/普通）、质押融资（需登记）；<br>• 实用新型/外观设计在维权、质押时可请求<strong>专利权评价报告</strong>评估稳定性。',s:'依据：《专利法》及专利运营相关办法。'}
  ];
  function best(q){
    var bi=-1,bs=-1;
    KB.forEach(function(e,i){
      var sc=0;e.kw.forEach(function(k){if(q.indexOf(k)>-1)sc+=k.length>2?3:2;});
      if(sc>bs){bs=sc;bi=i;}
    });
    return bs>0?KB[bi]:null;
  }
  function answer(q){
    var e=best(q);
    if(e){addMsg('ai',e.a,e.s,true);}
    else{addMsg('ai','我还没完全确定你的情况。可以告诉我：<br>① 你是<strong>学生 / 个人 / 创业者</strong>？<br>② 成果属于<strong>结构装置 / 方法软件 / 造型外观</strong>哪一类？<br>③ 预算和<strong>担心的问题</strong>（费用、周期、会不会被驳回…）？<br>我据此帮你定位到最合适的类型与路径，也可点下方快捷问题。',null,false);}
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function ask(q){
    q=(q||'').trim();if(!q)return;
    addMsg('user',esc(q),null,false);
    setTimeout(function(){answer(q);},260);
  }
  function fire(){ask(input.value);input.value='';input.focus();}
  send.addEventListener('click',fire);
  input.addEventListener('keydown',function(ev){if(ev.key==='Enter'){fire();}});
  document.querySelectorAll('#aiChips button').forEach(function(b){b.addEventListener('click',function(){ask(b.dataset.q);});});
})();




/* ===== 多页面视图路由（横向页签切换，每章一页） ===== */
(function(){
  var views=['home','what','types','why','flow','faq','tools','knowledge','service','after','official'];
  function show(id){
    views.forEach(function(v){
      var el=document.getElementById(v);
      if(el)el.classList.toggle('active',v===id);
    });
    document.querySelectorAll('.topnav a').forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#view-'+id);});
    window.scrollTo(0,0);
  }
  function route(){
    var h=(location.hash||'').replace('#view-','');
    if(views.indexOf(h)<0)h='home';
    show(h);
  }
  window.addEventListener('hashchange',route);
  route();
})();

</script>
